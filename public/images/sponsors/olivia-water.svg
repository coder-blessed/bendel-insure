<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Olivia Table Water logo">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#efefef"/>
    </linearGradient>
    <radialGradient id="water" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#dffcff"/>
      <stop offset="8%" stop-color="#9ae8ff"/>
      <stop offset="28%" stop-color="#3ecded"/>
      <stop offset="58%" stop-color="#139fe1"/>
      <stop offset="100%" stop-color="#0d2d92"/>
    </radialGradient>
    <linearGradient id="waterEdge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#11d3ff"/>
      <stop offset="35%" stop-color="#1bbaf5"/>
      <stop offset="70%" stop-color="#0e82d9"/>
      <stop offset="100%" stop-color="#0a2ea5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0b2f8f" flood-opacity="0.22"/>
    </filter>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="leaf" x1="0" x2="1">
      <stop offset="0%" stop-color="#a4ef58"/>
      <stop offset="100%" stop-color="#2fb54a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="8" y="8" width="1184" height="884" fill="none" stroke="#0a3ea8" stroke-width="6"/>

  <g filter="url(#shadow)">
    <circle cx="600" cy="430" r="360" fill="url(#water)" stroke="url(#waterEdge)" stroke-width="12"/>
  </g>

  <g opacity="0.8" filter="url(#blur)">
    <path d="M420 220 C480 160, 610 150, 690 220 C760 280, 788 380, 760 440 C726 518, 660 560, 590 572 C506 586, 430 560, 378 502 C316 429, 326 290, 420 220 Z" fill="#d4fbff"/>
    <path d="M660 175 C760 130, 895 155, 960 250 C1012 326, 1015 430, 970 500 C930 563, 863 596, 778 602 C723 604, 657 590, 606 553 C539 503, 502 443, 500 384 C497 284, 576 214, 660 175 Z" fill="#d9feff" opacity="0.9"/>
  </g>

  <g>
    <path d="M240 408 C270 390, 314 390, 352 420 C315 444, 276 460, 236 470 C197 481, 158 486, 132 500 C118 474, 122 446, 150 430 C175 415, 204 410, 240 408 Z" fill="#f8f8f8" opacity="0.85"/>
    <path d="M950 402 C972 396, 996 398, 1020 416 C1000 438, 972 457, 938 470 C908 482, 882 488, 856 490 C855 462, 868 432, 950 402 Z" fill="#f8f8f8" opacity="0.85"/>
  </g>

  <g transform="translate(278 288) rotate(-15)">
    <path d="M56 0 C17 -32, -42 -40, -76 -14 C-96 2, -104 30, -102 54 C-72 76, -29 82, 10 64 C46 46, 74 11, 56 0 Z" fill="url(#leaf)"/>
    <path d="M48 24 C31 35, 16 41, 2 40 C6 110, 53 134, 94 124 C78 89, 69 52, 48 24 Z" fill="#3ab34e" opacity="0.96"/>
  </g>

  <g>
    <text x="600" y="520" text-anchor="middle" font-size="360" font-weight="900" font-family="Arial Black, Arial, sans-serif" letter-spacing="-25" fill="#f8f8fb" stroke="#f8f8fb" stroke-width="8" paint-order="stroke fill" transform="skewX(-9)">olivia</text>
    <text x="600" y="520" text-anchor="middle" font-size="360" font-weight="900" font-family="Arial Black, Arial, sans-serif" letter-spacing="-25" fill="none" stroke="#0a2b7a" stroke-width="16" paint-order="stroke fill" transform="skewX(-9)">olivia</text>
  </g>

  <g>
    <path d="M332 610 C430 586, 521 574, 600 576 C744 580, 822 610, 928 650 C852 698, 775 720, 600 724 C476 726, 405 687, 332 610 Z" fill="#f8f8fb" opacity="0.9"/>
    <text x="600" y="682" text-anchor="middle" font-size="94" font-weight="900" font-family="Arial Black, Arial, sans-serif" letter-spacing="10" fill="#e52a28" stroke="#0a2b7a" stroke-width="3" paint-order="stroke fill">TABLE WATER</text>
  </g>

  <g transform="translate(1068 216)">
    <circle cx="0" cy="0" r="42" fill="#f8f8fb" stroke="#0a2b7a" stroke-width="5"/>
    <text x="0" y="15" text-anchor="middle" font-size="62" font-weight="700" font-family="Arial, sans-serif" fill="#0a2b7a">®</text>
  </g>
